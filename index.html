<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contract Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14l2 2 4-4"/></svg>
      </span>
      <span class="brand-name">Contract Review</span>
    </div>
    <button id="replace-btn" class="btn-outline" type="button" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      Replace file
    </button>
  </header>

  <main class="layout">
    <!-- Left: contract preview -->
    <section class="panel panel-contract" aria-label="Contract preview">
      <div id="file-bar" class="panel-bar" hidden>
        <span class="file-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </span>
        <div class="file-meta">
          <div id="file-name" class="file-name"></div>
          <div id="file-size" class="file-size"></div>
        </div>
      </div>

      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Upload a PDF contract">
        <span class="dropzone-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        </span>
        <p class="dropzone-title">Drop a PDF contract here</p>
        <p class="dropzone-sub">or <span class="dropzone-link">browse your files</span></p>
        <p class="dropzone-hint">PDF files only</p>
        <p id="upload-error" class="error" role="alert" hidden></p>
      </div>
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden>

      <div id="viewer" class="viewer" hidden>
        <iframe id="pdf-frame" title="Contract PDF preview"></iframe>
      </div>
    </section>

    <!-- Right: chat -->
    <section class="panel panel-chat" aria-label="Chat">
      <div class="panel-bar chat-head">
        <div>
          <h2>Ask about this contract</h2>
          <p>Questions about terms, risks and obligations</p>
        </div>
        <span class="dot" aria-hidden="true"></span>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="msg bot">Upload a contract, then ask me questions about it.</div>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="sr-only">Message</label>
        <input id="chat-input" type="text" placeholder="Ask a question about the contract…">
        <button id="send-btn" type="submit" disabled>
          Send
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
